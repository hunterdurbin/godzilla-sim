name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-private-calls:
    name: Engine Private Calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No new calls into engine private methods
        run: python3 scripts/tools/check_engine_private_calls.py

  card-monster-zone-checks:
    name: Card Monster-Zone Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No new play-zone legality checks in card scripts
        run: python3 scripts/tools/check_card_monster_zone_checks.py

      - name: Card scripts mutate state only through engine primitives
        run: python3 scripts/tools/check_card_mutations.py

      - name: Engine announces every card-ability resolution
        run: python3 scripts/tools/check_effect_resolution_notes.py

      - name: Card scripts await engine coroutines
        run: python3 scripts/tools/check_card_unawaited_coroutines.py

      - name: No array literals into typed-array params via dynamic calls
        run: python3 scripts/tools/check_typed_array_dynamic_calls.py

      - name: PlayerInput implementations and prompt handlers match the port
        run: python3 scripts/tools/check_player_input_contract.py

      - name: Only the trigger dispatcher builds StandbyEntry objects
        run: python3 scripts/tools/check_standby_entry_builders.py

      - name: Only MonsterMover writes monster_zone
        run: python3 scripts/tools/check_monster_zone_writers.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      # On a fresh checkout the startup theme (theme/custom) loads before the
      # scan imports its font, so this step logs NotoSans/default_theme
      # "non-existent resource" errors; the font is reimported moments later
      # and later launches load it fine. Expected noise.
      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run gdUnit4 suite
        run: ./tests/run_unit_tests.sh godot

      # The godot-ci image ships without Python.
      - name: Install python3
        run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null

      - name: No new GDScript warnings
        run: python3 scripts/tools/check_gdscript_warnings.py godot
