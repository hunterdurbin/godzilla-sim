name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name "Engine Private Calls" is a required status check on main
  # (repo ruleset "Main branch"); this job now runs every mechanical check.
  engine-private-calls:
    name: Engine Private Calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The one list of checks (pre-commit runs the same script with
      # --staged). No Godot here, so check_gdscript_warnings.py runs in
      # Unit Tests below.
      - name: Mechanical checks (scripts/tools/run_checks.sh)
        run: bash scripts/tools/run_checks.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      # On a fresh checkout the startup theme (theme/custom) loads before the
      # scan imports its font, so this step logs NotoSans/default_theme
      # "non-existent resource" errors; the font is reimported moments later
      # and later launches load it fine. Expected noise.
      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run gdUnit4 suite
        run: ./tests/run_unit_tests.sh godot

      # The godot-ci image ships without Python.
      - name: Install python3
        run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null

      - name: No new GDScript warnings
        run: python3 scripts/tools/check_gdscript_warnings.py godot
