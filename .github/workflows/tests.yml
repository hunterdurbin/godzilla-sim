name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-private-calls:
    name: Engine Private Calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No new calls into engine private methods
        run: python3 scripts/tools/check_engine_private_calls.py

  card-monster-zone-checks:
    name: Card Monster-Zone Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No new play-zone legality checks in card scripts
        run: python3 scripts/tools/check_card_monster_zone_checks.py

      - name: Card scripts await engine coroutines
        run: python3 scripts/tools/check_card_unawaited_coroutines.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      # On a fresh checkout the startup theme (theme/custom) loads before the
      # scan imports its font, so this step logs NotoSans/default_theme
      # "non-existent resource" errors; the font is reimported moments later
      # and later launches load it fine. Expected noise.
      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run gdUnit4 suite
        run: ./tests/run_unit_tests.sh godot
