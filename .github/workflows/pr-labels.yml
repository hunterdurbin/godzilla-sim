name: Copy Issue Labels to PR

on:
  pull_request:
    types: [opened]

jobs:
  copy-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            const pattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i;
            const match = prBody.match(pattern) || prTitle.match(pattern);
            if (!match) {
              console.log('No linked issue found in PR title or body');
              return;
            }
            const issueNumber = parseInt(match[1]);
            console.log(`Found linked issue #${issueNumber}`);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = issue.labels.map(l => l.name);
            if (labels.length === 0) {
              console.log('Issue has no labels');
              return;
            }
            console.log(`Copying labels: ${labels.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels,
            });
