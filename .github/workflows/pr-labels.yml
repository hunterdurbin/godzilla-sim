name: Copy Issue Labels to PR

on:
  pull_request:
    types: [opened]

jobs:
  copy-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        id: issue-labels
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const match = prBody.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!match) return [];
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(match[1]),
            });
            return issue.labels.map(l => l.name);
      - uses: actions/github-script@v7
        if: ${{ fromJSON(steps.issue-labels.outputs.result).length > 0 }}
        with:
          script: |
            const labels = ${{ steps.issue-labels.outputs.result }};
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels,
            });
