name: Copy Issue Labels to PR

on:
  pull_request:
    types: [opened]

jobs:
  copy-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - uses: michalvankodev/copy-issue-labels@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
