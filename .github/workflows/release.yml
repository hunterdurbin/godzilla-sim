name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.6"
  PROJECT_NAME: "godzilla_tcg_sim"

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/windows

      - name: Export Windows
        run: godot --headless --export-release "Windows Desktop" build/windows/${PROJECT_NAME}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/

  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/linux

      - name: Export Linux
        run: godot --headless --export-release "Linux" build/linux/${PROJECT_NAME}.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/

  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/macos

      - name: Export macOS
        run: godot --headless --export-release "macOS" build/macos/${PROJECT_NAME}.app

      - name: Zip macOS app
        run: |
          cd build/macos
          zip -r ${PROJECT_NAME}-macos.zip ${PROJECT_NAME}.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.zip

  build-flatpak:
    name: Flatpak Build
    needs: [export-linux]
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: flatpak/

      - name: Copy icon for Flatpak build
        run: cp CardContent/Assets/Icons/game_icon.png flatpak/game_icon.png

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.hunterdurbin.UnOfficialGodzillaSim.yml
          bundle: ${{ env.PROJECT_NAME }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache-key: flatpak-builder-

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.PROJECT_NAME }}.flatpak

  create-release:
    name: Create Release
    needs: [export-windows, export-linux, export-macos, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Zip platform builds
        run: |
          cd windows && zip -r ../${PROJECT_NAME}-windows.zip . && cd ..
          cd linux && zip -r ../${PROJECT_NAME}-linux.zip . && cd ..
        env:
          PROJECT_NAME: godzilla_tcg_sim

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            godzilla_tcg_sim-windows.zip
            godzilla_tcg_sim-linux.zip
            macos/godzilla_tcg_sim-macos.zip
            flatpak/godzilla_tcg_sim.flatpak
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'unstable') }}
