name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.6"
  PROJECT_NAME: "godzilla_tcg_sim"

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/windows

      - name: Export Windows
        run: godot --headless --export-release "Windows Desktop" build/windows/${PROJECT_NAME}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/

  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/linux

      - name: Export Linux
        run: godot --headless --export-release "Linux" build/linux/${PROJECT_NAME}.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/

  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/macos

      - name: Export macOS
        run: godot --headless --export-release "macOS" build/macos/${PROJECT_NAME}.app

      - name: Zip macOS app
        run: |
          cd build/macos
          zip -r ${PROJECT_NAME}-macos.zip ${PROJECT_NAME}.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.zip

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          echo "Templates at HOME:" && ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Templates at /root:" && ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          echo "Find all export templates:" && find / -path "*/export_templates/${GODOT_VERSION}.stable" -type d 2>/dev/null || true

      - name: Create build directory
        run: mkdir -p build/web

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/

  build-flatpak:
    name: Flatpak Build
    needs: [export-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install SDK and runtime
        run: |
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: flatpak/

      - name: Copy icon for Flatpak build
        run: cp CardContent/Assets/Icons/game_icon.png flatpak/game_icon.png

      - name: Build Flatpak
        run: |
          cd flatpak
          flatpak-builder --force-clean build-dir io.github.hunterdurbin.UnOfficialGodzillaSim.yml

      - name: Create Flatpak bundle
        run: |
          cd flatpak
          flatpak build-export repo build-dir
          flatpak build-bundle repo ${PROJECT_NAME}.flatpak io.github.hunterdurbin.UnOfficialGodzillaSim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: flatpak/${{ env.PROJECT_NAME }}.flatpak

  create-release:
    name: Create Release
    needs: [export-windows, export-linux, export-macos, export-web, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Zip platform builds
        run: |
          cd windows && zip -r ../${PROJECT_NAME}-windows.zip . && cd ..
          cd linux && zip -r ../${PROJECT_NAME}-linux.zip . && cd ..
          cd web && zip -r ../${PROJECT_NAME}-web.zip . && cd ..
        env:
          PROJECT_NAME: godzilla_tcg_sim

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            godzilla_tcg_sim-windows.zip
            godzilla_tcg_sim-linux.zip
            macos/godzilla_tcg_sim-macos.zip
            godzilla_tcg_sim-web.zip
            flatpak/godzilla_tcg_sim.flatpak
          generate_release_notes: true
          draft: false
          prerelease: false
