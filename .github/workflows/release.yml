name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.6"
  PROJECT_NAME: "godzilla_tcg_sim"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run gdUnit4 suite
        run: ./tests/run_unit_tests.sh godot

  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi

      - name: Create build directory
        run: mkdir -p build/windows

      - name: Export Windows
        env:
          PRESET: ${{ contains(github.ref_name, 'unstable') && 'Windows Desktop Unstable' || 'Windows Desktop' }}
          SUFFIX: ${{ contains(github.ref_name, 'unstable') && '_unstable' || '' }}
        run: |
          OUTPUT="build/windows/${PROJECT_NAME}${SUFFIX}.exe"
          godot --headless --export-release "$PRESET" "$OUTPUT"
          ls -la build/windows/
          test -f "$OUTPUT" || { echo "ERROR: $OUTPUT not produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/

  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi

      - name: Create build directory
        run: mkdir -p build/linux

      - name: Export Linux
        env:
          PRESET: ${{ contains(github.ref_name, 'unstable') && 'Linux Unstable' || 'Linux' }}
          SUFFIX: ${{ contains(github.ref_name, 'unstable') && '_unstable' || '' }}
        run: |
          OUTPUT="build/linux/${PROJECT_NAME}${SUFFIX}.x86_64"
          godot --headless --export-release "$PRESET" "$OUTPUT"
          ls -la build/linux/
          test -f "$OUTPUT" || { echo "ERROR: $OUTPUT not produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/

  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi

      - name: Create build directory
        run: mkdir -p build/macos

      - name: Export macOS
        env:
          PRESET: ${{ contains(github.ref_name, 'unstable') && 'macOS Unstable' || 'macOS' }}
          SUFFIX: ${{ contains(github.ref_name, 'unstable') && '_unstable' || '' }}
        run: |
          OUTPUT="build/macos/${PROJECT_NAME}${SUFFIX}.app"
          godot --headless --export-release "$PRESET" "$OUTPUT"
          ls -la build/macos/
          test -d "$OUTPUT" || { echo "ERROR: $OUTPUT not produced"; exit 1; }

      - name: Zip macOS app
        run: |
          cd build/macos
          zip -r ${PROJECT_NAME}-macos.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.zip

  # TODO: For Google Play publishing, this job needs:
  #   1. Generate a release keystore: keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000
  #   2. Base64-encode it and store as GitHub secret ANDROID_KEYSTORE_BASE64
  #   3. Add secrets ANDROID_KEYSTORE_USER (alias) and ANDROID_KEYSTORE_PASS (password)
  #   4. Decode keystore in CI and set env vars:
  #        GODOT_ANDROID_KEYSTORE_RELEASE_PATH, GODOT_ANDROID_KEYSTORE_RELEASE_USER, GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
  #   5. Switch export_format to 1 (AAB) in export_presets.cfg for Play Store uploads
  #   6. Update package/unique_name in export_presets.cfg from "com.example.godzilla_tcg_sim"
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates and editor settings
        run: |
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          if [ -d "$SRC" ] && [ "$SRC" != "$DEST" ]; then
            ln -sf "$SRC"/* "$DEST/"
          fi
          mkdir -p ~/.config/godot
          if [ "$HOME" != "/root" ]; then
            cp /root/.config/godot/editor_settings-4.6.tres ~/.config/godot/
          fi

      - name: Create build directory
        run: mkdir -p build/android

      - name: Export Android
        env:
          PRESET: ${{ contains(github.ref_name, 'unstable') && 'Android Unstable' || 'Android' }}
          SUFFIX: ${{ contains(github.ref_name, 'unstable') && '_unstable' || '' }}
        run: |
          OUTPUT="build/android/${PROJECT_NAME}${SUFFIX}.apk"
          godot --headless --export-debug "$PRESET" "$OUTPUT"
          ls -la build/android/
          test -f "$OUTPUT" || { echo "ERROR: $OUTPUT not produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/

  export-server:
    name: Dedicated Server Export
    runs-on: ubuntu-latest
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi

      - name: Create build directory
        run: mkdir -p build/server

      # One preset serves both channels — the release channel is baked into
      # the version string, and the server version-gates clients at HELLO.
      - name: Export Dedicated Server
        run: |
          OUTPUT="build/server/godzilla_tcg_server.x86_64"
          godot --headless --export-release "Linux Server" "$OUTPUT"
          ls -la build/server/
          test -f "$OUTPUT" || { echo "ERROR: $OUTPUT not produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: build/server/

  build-server-image:
    name: Server Docker Image
    needs: [export-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/godzilla-tcg-server
    steps:
      - uses: actions/checkout@v4

      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: server
          path: build/server/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          CHANNEL: ${{ contains(github.ref_name, 'unstable') && 'unstable' || 'stable' }}
        run: |
          docker build -f deploy/server/Dockerfile \
            -t "$IMAGE_NAME:${{ github.ref_name }}" \
            -t "$IMAGE_NAME:$CHANNEL" \
            .
          docker push "$IMAGE_NAME:${{ github.ref_name }}"
          docker push "$IMAGE_NAME:$CHANNEL"

  # Deploys are dormant until the DEPLOY_SERVER_ENABLED repo variable is set
  # to 'true' (Settings -> Secrets and variables -> Actions -> Variables).
  # The host blocks inbound SSH today; see deploy/server/README.md for the
  # pull-based options when enabling.
  deploy-server-unstable:
    name: Deploy Server (unstable)
    if: ${{ contains(github.ref_name, 'unstable') && vars.DEPLOY_SERVER_ENABLED == 'true' }}
    needs: [build-server-image]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/godzilla-game-server/unstable
            echo "IMAGE=ghcr.io/${{ github.repository_owner }}/godzilla-tcg-server:${{ github.ref_name }}" > .env
            docker compose -p godzilla-server-unstable pull
            docker compose -p godzilla-server-unstable up -d
            sleep 5
            curl -sf http://localhost:12112/ | head -1

  deploy-server-stable:
    name: Deploy Server (stable)
    if: ${{ !contains(github.ref_name, 'unstable') && vars.DEPLOY_SERVER_ENABLED == 'true' }}
    needs: [build-server-image]
    runs-on: ubuntu-latest
    # Requires the "production" GitHub environment with a required reviewer —
    # the job waits for manual approval before touching the stable server.
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/godzilla-game-server/stable
            echo "IMAGE=ghcr.io/${{ github.repository_owner }}/godzilla-tcg-server:${{ github.ref_name }}" > .env
            docker compose -p godzilla-server-stable pull
            docker compose -p godzilla-server-stable up -d
            sleep 5
            curl -sf http://localhost:12102/ | head -1

  build-flatpak:
    name: Flatpak Build
    needs: [export-linux]
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: flatpak/

      - name: Copy icon for Flatpak build
        run: cp assets/icons/game_icon.png flatpak/game_icon.png

      - name: Inspect flatpak build inputs
        run: ls -la flatpak/

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ contains(github.ref_name, 'unstable') && 'flatpak/io.github.hunterdurbin.UnOfficialGodzillaSim.Unstable.yml' || 'flatpak/io.github.hunterdurbin.UnOfficialGodzillaSim.yml' }}
          bundle: ${{ env.PROJECT_NAME }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.PROJECT_NAME }}.flatpak

  create-release:
    name: Create Release
    needs: [export-windows, export-linux, export-macos, export-android, build-flatpak, export-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Zip platform builds
        run: |
          cd windows && zip -r ../${PROJECT_NAME}-windows.zip . && cd ..
          cd linux && zip -r ../${PROJECT_NAME}-linux.zip . && cd ..
          cd server && zip -r ../godzilla_tcg_server-linux.zip . && cd ..
        env:
          PROJECT_NAME: godzilla_tcg_sim

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            godzilla_tcg_sim-windows.zip
            godzilla_tcg_sim-linux.zip
            macos/godzilla_tcg_sim-macos.zip
            android/*.apk
            flatpak/godzilla_tcg_sim.flatpak
            godzilla_tcg_server-linux.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'unstable') }}
